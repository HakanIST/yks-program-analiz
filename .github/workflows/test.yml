name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıklar
        run: python3 -m pip install -r tools/requirements.txt pandas

      - name: Veri setini ham veriden yeniden üret
        run: python3 tools/build_dataset.py --girdi data/raw/yks-ham.csv.gz

      - name: Üretilen veri depodakiyle aynı mı
        # meta.json içindeki "uretim" alanı üretim tarihidir; karşılaştırmada yok
        # sayılır, yoksa kontrol yalnızca verinin üretildiği gün geçer.
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys
          def depodaki(yol):
              return subprocess.run(["git", "show", f"HEAD:{yol}"], capture_output=True, text=True, check=True).stdout
          hatali = []
          for yol in ("docs/data/meta.json", "docs/data/records.json"):
              eski, yeni = json.loads(depodaki(yol)), json.load(open(yol, encoding="utf-8"))
              if yol.endswith("meta.json"):
                  eski.pop("uretim", None); yeni.pop("uretim", None)
              if eski != yeni:
                  hatali.append(yol)
          if hatali:
              print("::error::docs/data içeriği ham veriyle uyuşmuyor; build_dataset.py çalıştırılıp sonuç işlenmeli: " + ", ".join(hatali))
              subprocess.run(["git", "diff", "--stat", "--", "docs/data"])
              sys.exit(1)
          print("docs/data ham veriyle uyumlu")
          EOF

      - name: Beklenen sonuçları pandas ile üret
        run: python3 tools/tests/groundtruth.py

      - name: Sıralama motoru testleri
        run: node tools/tests/ranking.test.mjs
